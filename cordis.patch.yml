# dsh-reasoning-bridge 的 bundle 补丁层：经 dsh plugin add 安装时，
# 自动把插件插入 profile 的组合树（等效于手写启用条目）。
#
# 这里只挂主入口（技能/提示词/设置）。web 专属路由子入口
# （lib/web.js，依赖 webServer）不在这里插行：bundle 补丁对任何装了本插件的
# profile 生效，headless/CLI 也会执行，而 webServer 只在 web profile 存在，
# 根级行会停在 "pending waiting for service"。
# 解法：主入口 lib/index.js 用作用域注入 ctx.inject(['webServer','loader'], …)
# 按服务存在与否条件挂载 —— web profile 自动生效，headless 完全不执行，
# 也不需要任何 profile 级手写补丁。
- insert:
    - id: dsh-reasoning-bridge
      name: 'dsh-reasoning-bridge'
